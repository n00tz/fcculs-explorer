name: Tests

# Fast, no-real-infra unit tests only -- runs on every push/PR against
# master as a first line of defense. This intentionally does NOT run
# integration_test.py, real_smtp_smoke_test.py, or any other test that
# needs a real Postgres/Redis/SMTP listener: those stay part of this
# project's established manual pre-deploy methodology (disposable Podman
# pods on the target host, see api/tests/run_integration.sh and
# notifier/tests/run_integration.sh), and are not reproduced here. A green
# run of this workflow is necessary but not sufficient before a feature is
# considered "done" -- see docs/plan.md's Progress Log for the full
# real-infra testing methodology every change still goes through.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Symlink api/ to /app
        # Every test file in api/tests hardcodes
        # `sys.path.insert(0, "/app")` -- matching the container mount path
        # used by api/tests/run_integration.sh's disposable Podman pod
        # (`-v /tmp/api_full:/app:Z`). Symlinking here reuses those files
        # completely unmodified rather than forking a CI-only import path.
        run: sudo ln -s "$GITHUB_WORKSPACE/api" /app

      - name: Run mocked unit tests (no real Postgres/Redis/SMTP)
        env:
          FCCULS_SESSION_SECRET: test-secret
          FCCULS_MAGIC_LINK_BASE_URL: http://testserver
        run: |
          python3 -m pytest \
            api/tests/test_mailer.py \
            api/tests/test_auth_base_url.py \
            api/tests/test_url_safety.py \
            api/tests/test_security.py \
            api/tests/test_admin_auth.py \
            -v
          # NOT run here (require real infra, run manually per
          # api/tests/run_integration.sh):
          #   test_ratelimit.py    -- needs a real Redis (enforce_rate_limit)
          #   integration_test.py  -- needs a real Postgres + full app
          #   real_smtp_smoke_test.py -- needs a real SMTP listener

  notifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: notifier/requirements.txt

      - name: Install dependencies
        run: pip install -r notifier/requirements.txt

      - name: Symlink notifier/ to /app
        # Same rationale as the api job: notifier/tests files hardcode
        # sys.path.insert(0, "/app") to match
        # notifier/tests/run_integration.sh's Podman mount.
        run: sudo ln -s "$GITHUB_WORKSPACE/notifier" /app

      - name: Run mocked unit tests (no real Postgres/Redis)
        run: |
          python3 -m pytest \
            notifier/tests/test_senders.py \
            notifier/tests/test_url_safety.py \
            -v
          # NOT run here (requires real Postgres + Redis, run manually per
          # notifier/tests/run_integration.sh):
          #   integration_test.py

  mcpsrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 to match the api and notifier jobs above. mcpsrv's own
          # Dockerfile runs python:3.14-slim, so CI is deliberately a
          # version behind the runtime image -- but that same gap already
          # exists for api/notifier (both also 3.12 here against 3.14
          # images), so this keeps the established pattern rather than
          # introducing a fourth inconsistency. Verified: mcp==2.2.* and
          # httpx2==2.12.* both install and all 12 tests pass on 3.12.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcpsrv/requirements.txt

      - name: Install dependencies
        # pytest is NOT in mcpsrv/requirements.txt (unlike api's and
        # notifier's), because that file is installed straight into the
        # production image by mcpsrv/Dockerfile -- adding a test-only
        # dependency there would ship it to production and into the SBOM.
        # mcpsrv/tests/run_integration.sh installs pytest separately for
        # the same reason; this mirrors it, pinned to the ==9.* the other
        # two services use.
        run: |
          pip install -r mcpsrv/requirements.txt
          pip install "pytest==9.*"

      - name: Symlink mcpsrv/ to /app
        # Same /app convention as the api and notifier jobs, and as
        # mcpsrv/tests/run_integration.sh (which mounts the service at
        # /app inside its container). Note the mechanism differs slightly:
        # api/notifier test files hardcode sys.path.insert(0, "/app"),
        # whereas mcpsrv/tests/test_tools.py imports plainly
        # (`from app import tools as tools_mod`) and relies on the working
        # directory instead -- hence the `cd /app` in the run step below.
        # Kept as a symlink anyway rather than forking a CI-only import
        # path, so all three Python services stage identically.
        run: sudo ln -s "$GITHUB_WORKSPACE/mcpsrv" /app

      - name: Run mocked unit tests (no real Postgres/Redis/api/network)
        # `cd /app` puts the service root on sys.path via `python -m`,
        # which is what makes `from app import ...` resolve -- the same
        # thing run_integration.sh achieves with its `cd /tmp/run`.
        working-directory: /app
        run: |
          python3 -m pytest tests/test_tools.py -v
          # NOT run here (both need a real running api + Postgres + Redis +
          # MCP stack, run manually per mcpsrv/tests/run_integration.sh):
          #   integration_test.py -- drives a real MCP client over
          #                          streamable HTTP against a live pod
          #   live_check.py       -- exercises all 11 tools against the
          #                          deployed production server
          #
          # This job only wires the *unit* tests into CI. The plan's
          # three-stage bar for any future MCP change -- unit ->
          # disposable-container integration -> live production check --
          # still requires running run_integration.sh and live_check.py by
          # hand before the change is considered done. A green CI run is
          # necessary but not sufficient, exactly as this file's header
          # comment already states for the other jobs.

  web:
    runs-on: ubuntu-latest
    # There is no JS/Svelte unit test suite in this repo yet (no test
    # files, no "test" script in package.json) -- `npm run build` is the
    # fastest real, no-infra-required check available today: it's a
    # static `vite build` with SvelteKit's static adapter, needs no
    # backend/API/Postgres/Redis, and would have caught the invalid
    # Svelte dynamic-`type=` binding that silently produced a stale
    # production image in an earlier round of this project (see
    # docs/plan.md's Progress Log). Revisit this job once real web unit
    # tests exist.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Build (static Vite/SvelteKit build, no backend required)
        working-directory: web
        run: npm run build
